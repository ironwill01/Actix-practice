<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You • MySite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .hero-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.8)), 
                        url('https://picsum.photos/id/1015/2000/1200');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">M</div>
                <span class="font-semibold text-2xl">MySite</span>
            </div>
            
            <div class="hidden md:flex items-center space-x-8">
                <a href="/" class="hover:text-indigo-600 font-medium">Home</a>
                <a href="#" class="hover:text-indigo-600 font-medium">About</a>
                <a href="#" class="hover:text-indigo-600 font-medium">Services</a>
                <a href="#" class="hover:text-indigo-600 font-medium">Blog</a>
                <a href="#" class="hover:text-indigo-600 font-medium">Contact</a>
            </div>
            
            <a href="/" 
               class="bg-white border border-indigo-600 text-indigo-600 px-6 py-2.5 rounded-2xl font-medium hover:bg-indigo-50 transition">
                Back to Home
            </a>
        </div>
    </nav>

    <!-- Success Section -->
    <div class="min-h-screen flex items-center justify-center py-12 px-6 hero-bg">
        <div class="max-w-lg w-full bg-white rounded-3xl shadow-2xl p-10 text-center">
            <!-- Success Icon -->
            <div class="mx-auto w-24 h-24 bg-green-100 rounded-full flex items-center justify-center mb-8">
                <i class="fa-solid fa-check text-5xl text-green-600"></i>
            </div>

            <h1 class="text-5xl font-bold text-gray-900 mb-4">Thank You!</h1>
            <p class="text-xl text-gray-600 mb-10">Your signature has been added beautifully.</p>

            <!-- Signed Content -->
            <div id="signed-content" class="bg-gray-50 border border-gray-100 rounded-2xl p-8 mb-10 text-left">
                <div class="flex items-center gap-3 mb-4">
                    <div id="avatar" 
                         class="w-12 h-12 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-2xl">
                    </div>
                    <div>
                        <div id="display-name" class="font-semibold text-xl"></div>
                        <div class="text-green-600 text-sm font-medium">✓ Signed just now</div>
                    </div>
                </div>
                <p id="display-message" class="text-gray-700 italic text-lg leading-relaxed"></p>
            </div>

            <div class="space-y-4">
                <a href="/"
                   class="block w-full bg-indigo-600 text-white py-4 rounded-2xl font-semibold text-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-500/30">
                    Back to Homepage
                </a>
                
                <a href="signup.html" 
                   class="block w-full bg-white border border-gray-300 text-gray-700 py-4 rounded-2xl font-semibold hover:bg-gray-50 transition">
                    Sign Another Name
                </a>
            </div>

            <p class="text-center text-sm text-gray-500 mt-10">
                Made with ❤️ for beautiful moments
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-2 mb-8 md:mb-0">
                    <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">M</div>
                    <span class="font-semibold text-2xl">MySite</span>
                </div>
                
                <div class="flex flex-col md:flex-row gap-x-8 gap-y-4 text-center md:text-left">
                    <a href="#" class="hover:text-indigo-400">Twitter</a>
                    <a href="#" class="hover:text-indigo-400">Instagram</a>
                    <a href="#" class="hover:text-indigo-400">GitHub</a>
                    <a href="#" class="hover:text-indigo-400">LinkedIn</a>
                </div>
            </div>
            
            <div class="border-t border-gray-800 mt-12 pt-8 text-center text-gray-400 text-sm">
                © 2026 MySite. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        // Get data from URL parameters (passed from the sign handler)
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name') || "Guest";
        const message = urlParams.get('message') || "Thank you for visiting!";

        // Fill the success page
        document.getElementById('display-name').textContent = name;
        document.getElementById('display-message').textContent = `"${message}"`;
        
        // Set avatar initial
        const initial = name.charAt(0).toUpperCase();
        document.getElementById('avatar').textContent = initial;
    </script>
</body>
</html>
