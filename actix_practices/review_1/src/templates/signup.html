<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Your Name • MySite</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
    <style>
        body {
            font-family: 'Inter', system-ui, sans-serif;
        }
        .hero-bg {
            background: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.75)), url('https://picsum.photos/id/1015/2000/1200');
            background-size: cover;
            background-position: center;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Navbar -->
    <nav class="bg-white border-b sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">M</div>
                <span class="font-semibold text-2xl">MySite</span>
            </div>
            
            <div class="hidden md:flex items-center space-x-8">
                <a href="homepage.html" class="hover:text-indigo-600 font-medium">Home</a>
                <a href="#" class="hover:text-indigo-600 font-medium">About</a>
                <a href="#" class="hover:text-indigo-600 font-medium">Services</a>
                <a href="#" class="hover:text-indigo-600 font-medium">Blog</a>
                <a href="#" class="hover:text-indigo-600 font-medium">Contact</a>
            </div>
            
            <a href="/" 
               class="bg-white border border-indigo-600 text-indigo-600 px-6 py-2.5 rounded-2xl font-medium hover:bg-indigo-50 transition">
                Back to Home
            </a>
        </div>
    </nav>

    <!-- Sign Your Name Section -->
    <div class="min-h-screen flex items-center justify-center py-12 px-6 hero-bg">
        <div class="max-w-lg w-full bg-white rounded-3xl shadow-2xl p-10">
            <!-- Logo -->
            <div class="flex justify-center mb-8">
                <div class="flex items-center space-x-2">
                    <div class="w-10 h-10 bg-indigo-600 rounded-2xl flex items-center justify-center text-white font-bold text-3xl">M</div>
                    <span class="font-semibold text-3xl text-gray-900">MySite</span>
                </div>
            </div>

            <div class="text-center mb-8">
                <h1 class="text-4xl font-bold text-gray-900 mb-2">Sign Your Name</h1>
                <p class="text-gray-600">Leave your mark. Share a few words.</p>
            </div>

            <!-- Sign Form -->
            <form action="/sign" method="post" id="signForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Your Name</label>
                    <div class="relative">
                        <div class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400">
                            <i class="fa-solid fa-user"></i>
                        </div>
                        <input id="name" name="name" type="text" required placeholder="Alex Chen"
                               class="w-full pl-11 pr-4 py-4 bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:ring-indigo-500 rounded-2xl text-base outline-none transition">
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">Your Message</label>
                    <textarea id="message" name="message" rows="4" rows="4" required placeholder="Loving this beautiful website! Keep up the great work ✨"
                              class="w-full px-4 py-4 bg-gray-50 border border-gray-200 focus:border-indigo-500 focus:ring-indigo-500 rounded-3xl text-base outline-none transition resize-none"></textarea>
                </div>

                <!-- Submit Button -->
                <button type="submit"
                        class="w-full bg-indigo-600 text-white py-4 rounded-2xl font-semibold text-lg hover:bg-indigo-700 transition shadow-lg shadow-indigo-500/30">
                    Sign Your Name
                </button>
            </form>

            <p class="text-center text-sm text-gray-500 mt-8">
                This is just a beautiful demo. 
                <a href="/" class="text-indigo-600 hover:text-indigo-700 font-medium">Back to homepage</a>
            </p>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-12">
        <div class="max-w-7xl mx-auto px-6">
            <div class="flex flex-col md:flex-row justify-between items-center">
                <div class="flex items-center space-x-2 mb-8 md:mb-0">
                    <div class="w-8 h-8 bg-indigo-600 rounded-xl flex items-center justify-center text-white font-bold text-xl">M</div>
                    <span class="font-semibold text-2xl">MySite</span>
                </div>
                
                <div class="flex flex-col md:flex-row gap-x-8 gap-y-4 text-center md:text-left">
                    <a href="#" class="hover:text-indigo-400">Twitter</a>
                    <a href="#" class="hover:text-indigo-400">Instagram</a>
                    <a href="#" class="hover:text-indigo-400">GitHub</a>
                    <a href="#" class="hover:text-indigo-400">LinkedIn</a>
                </div>
            </div>
            
            <div class="border-t border-gray-800 mt-12 pt-8 text-center text-gray-400 text-sm">
                © 2026 MySite. All rights reserved.
            </div>
        </div>
    </footer>

    <script>
        document.getElementById('signForm').addEventListener('submit', async function(e) {
            //e.preventDefault();

            const formData = new FormData(this);
            
            try {
                const response = await fetch('/sign', {
                    method: 'POST',
                    body: formData
                });

                if (response.ok) {
                    const name = document.getElementById('name').value.trim();
                    const message = document.getElementById('message').value.trim();
                    alert(`🎉 Thank you, ${name}!\n\n"${message}"`);
                    this.reset(); // clear form
                }
            } catch (err) {
                console.error(err);
                alert("Something went wrong");
            }
        });
    </script>
</body>
</html>
