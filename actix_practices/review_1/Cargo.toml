[package]
name = "review_1"
version = "0.1.0"
edition = "2024"


[dependencies]
# Framework
actix-web = { version = "4", features = ["openssl"] }
actix-files = "0.6.10"

# HTML template generator
askama = "0.14.0"

# Core parts
env_logger = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
openssl = "0.10"
serde_json = "1.0"
derive_more = "2.1.1"
futures = "0.3"
actix-cors = "0.7.1"